# BrewPhase Desktop 双平台打包链路
# - 手动触发（release_tag 留空）：只构建并上传安装包 artifacts，不发布
# - 手动触发（填 release_tag）：把安装包上传为**已有 Release** 的资产，
#   用于给只发了 macOS 的 Release 补发 Windows 包；同名资产 --clobber 覆盖。
#   默认只上传 Windows 资产——CI 无签名 secrets，不能让它覆盖 Release 里
#   人工签名 + 公证过的 macOS 正式包。
# - 推送 desktop-v* tag：构建后创建「草稿」GitHub Release（需人工核对再公开）
# 签名/公证凭据全部走 Repository Secrets；未配置时明确产出未签名内测包。

name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已有 Release 的 tag（如 desktop-v0.1.0）；填写则上传为该 Release 的资产，留空只产出 artifacts'
        required: false
        type: string
        default: ''
      release_assets:
        description: '补发哪些平台的资产；默认 windows（保护 Release 里已签名公证的 macOS 包不被未签名 CI 包覆盖）'
        required: false
        type: choice
        options:
          - windows
          - all
        default: windows

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            os: macos-latest
          - id: windows-x64
            os: windows-latest
    defaults:
      run:
        working-directory: Desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 单测不依赖图形环境；`pnpm test` 会先构建 MCP stdio 入口——
      # mcp-protocol 集成测试真实 spawn `out/mcp/stdio.mjs`，而 out/ 不进
      # 版本库，checkout 后并不存在。e2e（Playwright + Electron）仍只在
      # 本机跑，见 README。
      - name: Unit tests
        run: pnpm test

      - name: Build renderer / main / preload
        run: pnpm build

      - name: Package macOS (dmg + zip)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_B64: ${{ secrets.MAC_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          args=(--mac --arm64 --publish never)
          if [[ -n "$MAC_CERT_P12_B64" && -n "$MAC_CERT_PASSWORD" \
             && -n "$APPLE_API_KEY_P8_B64" && -n "$APPLE_API_KEY_ID" \
             && -n "$APPLE_API_ISSUER" ]]; then
            echo "$MAC_CERT_P12_B64" | base64 -D > "$RUNNER_TEMP/brewphase-sign.p12"
            echo "$APPLE_API_KEY_P8_B64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
            export CSC_LINK="$RUNNER_TEMP/brewphase-sign.p12"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            # 有凭据却签/公证失败时直接失败，避免静默产出未签名包
            args+=(-c.mac.notarize=true -c.forceCodeSigning=true)
          else
            echo "::warning::Missing macOS signing/notarization secrets; unsigned build for internal testing only."
            # 无签名 + hardened runtime 会让 ad-hoc 包启动失败，内测包显式关掉
            args+=(-c.mac.notarize=false -c.mac.hardenedRuntime=false)
          fi
          pnpm exec electron-builder "${args[@]}"

      - name: Package Windows (NSIS exe)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CERT_P12_B64: ${{ secrets.WIN_CERT_P12_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $builderArgs = @('--win', '--x64', '--publish', 'never')
          if ($env:WIN_CERT_P12_B64 -and $env:WIN_CERT_PASSWORD) {
            $certPath = Join-Path $env:RUNNER_TEMP 'brewphase-win-sign.p12'
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_P12_B64))
            $env:CSC_LINK = $certPath
            $env:CSC_KEY_PASSWORD = $env:WIN_CERT_PASSWORD
            $builderArgs += '-c.forceCodeSigning=true'
          } else {
            Write-Host '::warning::Missing Windows code signing certificate; unsigned installer for internal testing only.'
          }
          pnpm exec electron-builder $builderArgs

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: brewphase-${{ matrix.id }}
          path: |
            Desktop/release/*.dmg
            Desktop/release/*.zip
            Desktop/release/*.exe
            Desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish installers to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # tag 触发用 tag 名；手动补发用输入里指定的已有 Release
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 首个 Release 的 macOS 资产附了 .sha256；这里统一生成，方便
      # `shasum -a 256 -c` 复核，补发 Windows 包时也能顺手带上校验文件。
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *.dmg *.zip *.exe; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          ls -lh

      # 只建草稿：签名/公证状态、下载页可用性需人工核对后再点 Publish。
      # tag 也可能由 GitHub Release 页/API 先行创建（那样发布 Release 本身
      # 就触发了本工作流），此时 `gh release create` 会因已存在而失败——
      # 回退为把安装包上传到现有 Release（--clobber 覆盖同名资产）。
      - name: Create draft release (tag push)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --generate-notes \
          || gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber

      # 手动补发：目标 Release 必须已存在（例如只有 macOS 资产的
      # desktop-v0.1.0）。先 view 校验 tag，再上传资产；不新建 Release，
      # 也不改动它的正文、草稿 / prerelease 状态。
      # 默认只补 Windows：macOS 的 dmg/zip 是人工签名 + 公证的正式包，
      # 而 CI 未配置签名 secrets，用 CI 产物覆盖会让 macOS 包失去公证。
      - name: Upload to existing release (manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ASSETS: ${{ inputs.release_assets || 'windows' }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          files=()
          if [ "$RELEASE_ASSETS" = "all" ]; then
            while IFS= read -r f; do files+=("$f"); done \
              < <(find dist -maxdepth 1 -type f -print)
          else
            while IFS= read -r f; do files+=("$f"); done \
              < <(find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.exe.sha256' \) -print)
          fi
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No matching assets in dist/"; exit 1; }
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

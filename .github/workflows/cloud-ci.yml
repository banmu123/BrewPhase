# BrewPhase Cloud CI（Phase 1.3.3-A-R5）
#
# 触发：cloud/ 或本工作流本身变更。
# 范围：typecheck → lint → test（真实 PostgreSQL 16）→ build → Docker build →
#       部署产物校验（compose 可解析、Caddyfile 合法、镜像内迁移可执行）。
#
# 硬约束（写在这里以免后人「顺手加一步」）：
#   - **不部署到任何服务器**：本工作流没有任何 ssh / scp / cloud deploy 步骤。
#   - **不使用生产 Secret**：全部凭据都是 CI 内的临时测试值，只活在
#     service container 里；workflow 中不出现 `secrets.*` 引用。
#   - **测试必须连真实 PostgreSQL**：`cloud/tests/global-setup.ts` 会在数据库
#     不可达时直接失败——绝不允许用 Mock 冒充（那正是 1.1B「假通过」的教训）。

name: Cloud CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-ci.yml'
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud

    services:
      # 与 cloud/vitest.config.ts 的默认 TEST_DATABASE_URL 对齐：
      #   postgres://brewphase:brewphase@127.0.0.1:54329/brewphase_cloud_test
      # 容器内 Postgres 仍监听 5432，映射到宿主 54329。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewphase
          POSTGRES_PASSWORD: brewphase
          POSTGRES_DB: brewphase_cloud_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U brewphase -d brewphase_cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://brewphase:brewphase@127.0.0.1:54329/brewphase_cloud_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不写 version：让 action 读 `cloud/package.json` 的
      # `packageManager: pnpm@9.0.0`，与 pnpm-lock.yaml 的锁文件版本保持单一事实来源。
      #
      # `package_json_file` **必须显式给出**：仓库根没有 package.json（这是个
      # monorepo，package.json 在 cloud/ 与 Desktop/ 下），而该 input 默认值是
      # 相对仓库根的 `package.json`。漏写时 action 找不到 packageManager 就直接
      # 失败在 "Setup pnpm" 这一步（实测：Cloud CI 首次运行即失败于此）。
      # 注意 `working-directory` 只作用于 `run` 步骤，对 `uses` 步骤无效。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: cloud/package.json

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，
      # 不允许 CI 悄悄重算依赖图。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # global-setup 会先对测试库跑迁移；数据库不可达 → 整个套件失败。
      - name: Test (real PostgreSQL)
        run: pnpm test

      - name: Build
        run: pnpm build

      # 迁移资产必须随构建进 dist（生产迁移入口依赖它）
      - name: Verify migration assets in dist
        run: |
          test -f dist/db/migrations/meta/_journal.json
          test -f dist/scripts/migrate.js
          test -f dist/scripts/preflight-remote-mcp.js
          test -f dist/index.js
          echo "dist entries present"

  docker:
    name: Docker image & deploy artifacts
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: cloud

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t brewphase-cloud:ci .

      # 运行镜像只带生产依赖：devDependencies 不该出现在生产层。
      - name: Verify runtime image has no devDependencies
        run: |
          for p in typescript eslint vitest drizzle-kit tsx; do
            if docker run --rm brewphase-cloud:ci sh -c "test -d node_modules/$p"; then
              echo "::error::devDependency $p leaked into the runtime image"
              exit 1
            fi
            echo "ok: $p absent"
          done
          for p in hono jose postgres ws zod; do
            docker run --rm brewphase-cloud:ci sh -c "test -d node_modules/$p" \
              || { echo "::error::runtime dependency $p missing"; exit 1; }
            echo "ok: $p present"
          done

      # 迁移入口必须能在镜像内独立执行（用临时 Postgres，不碰任何生产库）
      #
      # 用**共享 network + 服务名**而不是 host.docker.internal：后者是
      # Docker Desktop（macOS/Windows）专有的，Linux runner 上默认不存在，
      # 会直接 DNS 解析失败。共享 network 在两种平台行为一致。
      - name: Verify migrations run inside the image
        run: |
          docker network create mig-net
          docker run -d --name pg-mig --network mig-net \
            -e POSTGRES_USER=brewphase -e POSTGRES_PASSWORD=brewphase \
            -e POSTGRES_DB=brewphase_cloud_test \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg-mig pg_isready -U brewphase -d brewphase_cloud_test >/dev/null 2>&1 && break
            sleep 2
          done
          MIG_URL=postgres://brewphase:brewphase@pg-mig:5432/brewphase_cloud_test
          # 连跑两次：迁移必须幂等
          docker run --rm --network mig-net -e DATABASE_URL="$MIG_URL" \
            brewphase-cloud:ci node dist/scripts/migrate.js
          docker run --rm --network mig-net -e DATABASE_URL="$MIG_URL" \
            brewphase-cloud:ci node dist/scripts/migrate.js
          # 失败路径必须非零退出
          if docker run --rm --network mig-net \
            -e DATABASE_URL=postgres://brewphase:brewphase@pg-mig:5432/nope \
            brewphase-cloud:ci node dist/scripts/migrate.js; then
            echo "::error::migrate must fail on a missing database"
            exit 1
          fi
          echo "migrate idempotent + fail-closed OK"
          docker rm -f pg-mig
          docker network rm mig-net

      # 预检必须能失败：缺 MCP_BROWSER_SESSION_KEY 时 Remote MCP 是 404 而 /health 仍 200
      - name: Verify preflight fails without MCP_BROWSER_SESSION_KEY
        run: |
          if docker run --rm \
            -e NODE_ENV=production -e BASE_URL=https://ci.example.com \
            -e DATABASE_URL=postgres://x@db/x \
            -e JWT_SIGNING_KEY=0123456789abcdef0123456789abcdef \
            -e SESSION_TOKEN_PEPPER=0123456789abcdef \
            -e GOOGLE_CLIENT_ID=a -e GOOGLE_CLIENT_SECRET=b \
            -e GITHUB_CLIENT_ID=c -e GITHUB_CLIENT_SECRET=d \
            -e GATEWAY_EXPECTED_REPLICAS=1 \
            brewphase-cloud:ci node dist/scripts/preflight-remote-mcp.js; then
            echo "::error::preflight must fail when MCP_BROWSER_SESSION_KEY is missing"
            exit 1
          fi
          echo "preflight fail-closed OK"

      # 预检必须能通过（合法配置），且不输出任何 Secret 值
      - name: Verify preflight passes on a valid configuration
        run: |
          out=$(docker run --rm \
            -e NODE_ENV=production -e BASE_URL=https://ci.example.com \
            -e DATABASE_URL=postgres://x@db/x \
            -e JWT_SIGNING_KEY=0123456789abcdef0123456789abcdef \
            -e SESSION_TOKEN_PEPPER=0123456789abcdef \
            -e GOOGLE_CLIENT_ID=a -e GOOGLE_CLIENT_SECRET=b \
            -e GITHUB_CLIENT_ID=c -e GITHUB_CLIENT_SECRET=d \
            -e MCP_BROWSER_SESSION_KEY=9f8e7d6c5b4a39281706f5e4d3c2b1a0 \
            -e GATEWAY_EXPECTED_REPLICAS=1 \
            brewphase-cloud:ci node dist/scripts/preflight-remote-mcp.js)
          echo "$out"
          echo "$out" | grep -q "OK"
          # 输出里不得出现任何密钥值
          case "$out" in
            *0123456789abcdef*|*9f8e7d6c5b4a3928*)
              echo "::error::preflight leaked a secret"; exit 1;;
          esac
          echo "preflight OK + no secret leak"

      # 部署产物语法与约束回归：单副本、db 不对外、仅 Caddy 对外、Caddyfile 合法
      #
      # 用 `config --format json` + python 而不是 grep YAML 文本：
      # compose 的字段顺序不是契约，grep -A3 之类会随版本漂移成假通过/假失败。
      - name: Validate deploy artifacts
        working-directory: cloud/deploy
        run: |
          set -euo pipefail
          cp .env.production.example .env.production
          POSTGRES_PASSWORD=ci-only-password docker compose -f compose.yaml config \
            --format json > /tmp/resolved-compose.json
          echo "compose config OK"

          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/resolved-compose.json'))
          svcs = d['services']

          # 单副本：任何位置出现 replicas 都说明有人想跑多实例（Phase 1.4 之前禁止）
          assert 'replicas' not in json.dumps(d), 'replicas must not be configured'

          # 只有 Caddy 对外
          published = {str(p.get('published')) for p in (svcs['caddy'].get('ports') or [])}
          assert {'80', '443'} <= published, f'caddy must publish 80/443, got {published}'
          for name in ('cloud', 'db'):
              assert not svcs[name].get('ports'), f'{name} must not publish host ports'

          # db 在 internal 网络：宿主与公网都不可达
          assert d['networks']['data'].get('internal') is True, 'db network must be internal'
          assert set(svcs['db'].get('networks', {})) == {'data'}, 'db must only join data network'

          # 单副本 + 生产模式 + 代理信任边界钉死在 compose 里
          env = svcs['cloud'].get('environment') or {}
          assert env.get('GATEWAY_EXPECTED_REPLICAS') == '1', env.get('GATEWAY_EXPECTED_REPLICAS')
          assert env.get('NODE_ENV') == 'production'
          assert env.get('TRUST_PROXY') == 'true' and env.get('TRUST_PROXY_HOPS') == '1'
          assert 'DATABASE_URL' in env

          # cloud 必须等 db 健康才启动
          dep = svcs['cloud'].get('depends_on', {}).get('db', {})
          assert dep.get('condition') == 'service_healthy', dep

          print('deploy constraints OK')
          PY

          rm -f .env.production
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile 2>&1 | grep -q "Valid configuration" \
            || { echo "::error::Caddyfile invalid"; exit 1; }
          echo "caddyfile OK"

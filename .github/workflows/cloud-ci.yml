# BrewPhase Cloud CI（Phase 1.3.3-A-R5-R3）
#
# 触发：cloud/ 或本工作流本身变更。
# 范围：typecheck → lint → test（真实 PostgreSQL 16）→ build → Docker build →
#       **真实环境文件加载**验证（临时 .env.production + Compose 结构断言 +
#       镜像内预检三态 + 域名/数据库一致性负例 + 镜像内迁移幂等 +
#       Caddyfile 正反向 validate）。
#
# 硬约束（写在这里以免后人「顺手加一步」）：
#   - **不部署到任何服务器**：本工作流没有任何 ssh / scp / cloud deploy 步骤。
#   - **不使用生产 Secret**：全部凭据都是 CI 内的临时测试值（非默认域名/邮箱/
#     口令），只活在临时 `.env.production` 与 service container 里；
#     workflow 中不出现 `secrets.*` 引用。
#   - **测试必须连真实 PostgreSQL**：`cloud/tests/global-setup.ts` 会在数据库
#     不可达时直接失败——绝不允许用 Mock 冒充（那正是 1.1B「假通过」的教训）。
#   - **部署断言必须解析 Compose 结构**：用 `docker compose config --format json`
#     + Python 断言，禁止 grep YAML 文本（字段顺序一变就会漂移成假通过）。
#   - **部署命令与手册逐字一致**：全部带 `--env-file .env.production`，且执行
#     前显式 `unset` 同名 Shell 变量——否则 Shell 环境会覆盖 env 文件，
#     「文件没被加载」的缺陷就会被掩盖。
#   - **负向测试必须断言「错误码」，不能只看退出码**：统一走
#     `.github/scripts/ci-assertions.sh` 里的 `expect_preflight_failure` /
#     `expect_failure_with_reason`。断言顺序固定为「扫 Secret → 判退出码 →
#     判错误码/原因」，诊断输出一律脱敏。禁止用持续生效的 `set +e` 包住整步，
#     也禁止用 `! grep` 代替显式判断——bash 的 `-e` 对 `!` 取反的命令不生效，
#     那等于「找到问题也不失败」。
#   - **Secret 名单只有一处**：`.github/scripts/ci-assertions.sh` 的
#     `CI_TEST_SECRETS`。新增敏感环境变量时改那里，不要散落在 workflow 里。

name: Cloud CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-ci.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-ci.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud

    services:
      # 与 cloud/vitest.config.ts 的默认 TEST_DATABASE_URL 对齐：
      #   postgres://brewphase:brewphase@127.0.0.1:54329/brewphase_cloud_test
      # 容器内 Postgres 仍监听 5432，映射到宿主 54329。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewphase
          POSTGRES_PASSWORD: brewphase
          POSTGRES_DB: brewphase_cloud_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U brewphase -d brewphase_cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # working-directory 对 uses 步骤无效，所以显式指到 cloud/。
          package_json_file: cloud/package.json
          # 不写 version：以 cloud/package.json 的 packageManager 为准（pnpm@9.0.0）。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: cloud/package.json
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (real PostgreSQL)
        run: pnpm test

      - name: Build
        run: pnpm build

      # 迁移资产必须随构建产物出现，否则运行镜像里没有 journal，迁移会静默 no-op。
      - name: Verify migration assets are copied into dist
        run: |
          test -f dist/db/migrations/meta/_journal.json
          test -f dist/scripts/migrate.js
          test -f dist/scripts/preflight-remote-mcp.js
          test -f dist/index.js
          echo "dist entries present"

  docker:
    name: Docker image & deploy artifacts
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        # 所有 compose 命令都在 deploy/ 下执行，与手册 `cd cloud/deploy` 一致。
        working-directory: cloud/deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. 临时生产配置 ────────────────────────────────────────────────
      # 关键：这些值**刻意非默认**（域名/邮箱/口令都不是模板里的占位），
      # 所以断言能区分「从文件读到了真值」与「回落到了默认值」。
      - name: Create temporary .env.production from the committed template
        run: |
          test -f .env.production.example
          cp .env.production.example .env.production
          chmod 600 .env.production

          # 填入**刻意非默认**的 CI 测试值（域名/邮箱/口令都不是模板占位），
          # 这样断言能区分「从文件读到了真值」与「回落到了默认值」。
          # 用 Python 而不是 sed -i：GNU/BSD 的 -i 语义不同，脚本要能在两边跑。
          python3 - <<'PYEOF'
          import pathlib, re

          p = pathlib.Path(".env.production")
          text = p.read_text()
          updates = {
              "ACME_EMAIL": "ci-bot@r5r3-deploy-check.example.org",
              "BREWPHASE_DOMAIN": "api.r5r3-deploy-check.example.org",
              "BASE_URL": "https://api.r5r3-deploy-check.example.org",
              "POSTGRES_PASSWORD": "7c1f0b9d4e2a6835fa91c0d7e5b32468",
              "JWT_SIGNING_KEY": "ci_r5r3_jwt_key_0123456789abcdefghijklmnop",
              "SESSION_TOKEN_PEPPER": "ci_r5r3_pepper_0123456789",
              "GOOGLE_CLIENT_ID": "ci-r5r3.apps.googleusercontent.com",
              "GOOGLE_CLIENT_SECRET": "ci_r5r3_google_secret_0123456789",
              "GITHUB_CLIENT_ID": "ci_r5r3_github_0123456789",
              "GITHUB_CLIENT_SECRET": "ci_r5r3_github_secret_0123456789",
              "MCP_BROWSER_SESSION_KEY": "ci_r5r3_mcp_key_0123456789abcdef",
          }
          for key, value in updates.items():
              pattern = re.compile(rf"^{re.escape(key)}=.*$", re.M)
              if pattern.search(text):
                  text = pattern.sub(f"{key}={value}", text)
              else:
                  text = text.rstrip("\n") + f"\n{key}={value}\n"
          p.write_text(text)
          PYEOF

          chmod 600 .env.production

          # 模板里这些必须是空的——防止有人把 Secret 提交进模板。
          # （POSTGRES_PASSWORD 例外：它是文档化的占位值，预检会拒绝它。）
          for k in JWT_SIGNING_KEY SESSION_TOKEN_PEPPER MCP_BROWSER_SESSION_KEY \
                   GOOGLE_CLIENT_SECRET GITHUB_CLIENT_SECRET ACME_EMAIL BREWPHASE_DOMAIN; do
            if grep -E "^${k}=.+" .env.production.example >/dev/null; then
              echo "::error::template .env.production.example has a value for $k"
              exit 1
            fi
          done
          # 生成的文件必须是 600，且绝不能进 Git。
          # （用 Python 取权限：GNU/BSD 的 stat 参数不同。）
          mode=$(python3 -c "import os; print(oct(os.stat('.env.production').st_mode)[-3:])")
          test "$mode" = "600" || { echo "::error::.env.production mode is $mode, want 600"; exit 1; }
          git -C ../.. check-ignore -q cloud/deploy/.env.production \
            || { echo "::error::.env.production is not gitignored"; exit 1; }
          echo "temporary .env.production created (mode 600, gitignored)"

      # ── 2. Compose 解析（与手册逐字一致的命令） ────────────────────────
      # 显式 unset 同名 Shell 变量：compose 的优先级是 Shell > env 文件，
      # 不 unset 的话「文件没被加载」也会被掩盖——这正是 R5-R3 要堵的缺口。
      - name: Unset shell credentials and validate Compose config
        run: |
          unset POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB \
                JWT_SIGNING_KEY JWT_SIGNING_KEY_PREVIOUS SESSION_TOKEN_PEPPER \
                GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
                MCP_BROWSER_SESSION_KEY ACME_EMAIL BREWPHASE_DOMAIN \
                BASE_URL DATABASE_URL NODE_ENV PORT 2>/dev/null || true
          test -z "${POSTGRES_PASSWORD:-}" || { echo "::error::POSTGRES_PASSWORD still set in shell"; exit 1; }
          docker compose --env-file .env.production config --quiet
          echo "compose config OK (all values came from .env.production)"

      # ── 3. 结构断言：解析结果必须真的来自那个文件 ──────────────────────
      - name: Resolve Compose config and assert deployment constraints
        run: |
          unset POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB \
                JWT_SIGNING_KEY SESSION_TOKEN_PEPPER \
                GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
                MCP_BROWSER_SESSION_KEY ACME_EMAIL BREWPHASE_DOMAIN \
                BASE_URL DATABASE_URL 2>/dev/null || true
          docker compose --env-file .env.production config --format json > /tmp/resolved.json
          python3 - <<'PYEOF'
          import json, re, urllib.parse

          d = json.load(open("/tmp/resolved.json"))
          svcs = d["services"]

          # 读回 env 文件里的期望值，避免断言写死（写死 = 换个值就假通过）
          env_file = {}
          for line in open(".env.production"):
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  k, v = line.split("=", 1)
                  env_file[k] = v

          # [1][2] Caddy 的两个变量必须来自 .env.production，且**只有**这两个。
          caddy_env = svcs["caddy"].get("environment") or {}
          assert set(caddy_env) == {"ACME_EMAIL", "BREWPHASE_DOMAIN"}, sorted(caddy_env)
          assert caddy_env["ACME_EMAIL"] == env_file["ACME_EMAIL"], caddy_env["ACME_EMAIL"]
          assert caddy_env["BREWPHASE_DOMAIN"] == env_file["BREWPHASE_DOMAIN"], caddy_env["BREWPHASE_DOMAIN"]
          # 非默认值：确认断言本身不是在比默认值。
          assert "example.com" not in caddy_env["BREWPHASE_DOMAIN"]
          assert "admin@example.com" != caddy_env["ACME_EMAIL"]
          assert not svcs["caddy"].get("env_file"), "caddy must not read the whole env file"
          print("  [1][2] caddy gets exactly ACME_EMAIL + BREWPHASE_DOMAIN from .env.production")

          # [3] Caddy 环境里不得出现任何 Secret（值也不能出现）。
          blob = json.dumps(caddy_env)
          for secret_name in ("JWT_SIGNING_KEY", "MCP_BROWSER_SESSION_KEY",
                              "SESSION_TOKEN_PEPPER", "GOOGLE_CLIENT_SECRET",
                              "GITHUB_CLIENT_SECRET", "POSTGRES_PASSWORD"):
              assert secret_name not in caddy_env, f"caddy got {secret_name}"
              assert secret_name not in blob
              secret_value = env_file.get(secret_name, "")
              if secret_value:
                  assert secret_value not in blob, f"caddy leaked value of {secret_name}"
          print("  [3] caddy has no JWT / MCP / provider / DB secrets")

          # [4] DATABASE_URL 必须按 POSTGRES_* 正确解析出 host/port/db/user/口令。
          cloud_env = svcs["cloud"].get("environment") or {}
          db_env = svcs["db"].get("environment") or {}
          url = cloud_env["DATABASE_URL"]
          u = urllib.parse.urlparse(url)
          assert u.scheme in ("postgres", "postgresql"), u.scheme
          assert u.hostname == "db", u.hostname          # compose 服务名，不是 127.0.0.1
          assert u.port == 5432, u.port
          assert u.path == "/" + env_file["POSTGRES_DB"], u.path
          assert u.username == env_file["POSTGRES_USER"], u.username
          assert u.password == env_file["POSTGRES_PASSWORD"], "DATABASE_URL password mismatch"
          # db 容器拿到的是同一套凭据。
          assert db_env["POSTGRES_PASSWORD"] == env_file["POSTGRES_PASSWORD"]
          assert db_env["POSTGRES_DB"] == env_file["POSTGRES_DB"]
          print(f"  [4] DATABASE_URL -> {u.hostname}:{u.port}{u.path} (user+password match)")

          # [5] Cloud 与 DB 不得发布宿主端口。
          for name in ("cloud", "db"):
              assert not svcs[name].get("ports"), f"{name} publishes host ports"
          print("  [5] cloud/db publish no host ports")

          # [6] DB 只挂 internal 网络。
          assert d["networks"]["data"].get("internal") is True, "data network must be internal"
          assert set(svcs["db"]["networks"]) == {"data"}, sorted(svcs["db"]["networks"])
          print("  [6] db is on the internal network only")

          # [7] 单副本：无 replicas 字段，且 GATEWAY_EXPECTED_REPLICAS=1。
          assert "replicas" not in json.dumps(d), "compose must not define replicas"
          assert cloud_env["GATEWAY_EXPECTED_REPLICAS"] == "1"
          assert cloud_env["NODE_ENV"] == "production"
          assert cloud_env["TRUST_PROXY"] == "true" and cloud_env["TRUST_PROXY_HOPS"] == "1"
          print("  [7] single replica / NODE_ENV=production / single-layer proxy trust")

          # [8] 只有 Caddy 对外 80/443。
          published = {str(p.get("published")) for p in (svcs["caddy"].get("ports") or [])}
          assert {"80", "443"} <= published, published
          print("  [8] only caddy publishes 80/443")

          # [9] cloud 必须等 db 健康（否则会连上一个还没就绪的库）。
          assert svcs["cloud"]["depends_on"]["db"]["condition"] == "service_healthy"
          print("  [9] cloud waits for db to be healthy")

          # [10] 全部 secret 值不得出现在解析结果里（除 cloud/db 自己的 environment）。
          allowed = {"cloud", "db"}
          for name, svc in svcs.items():
              if name in allowed:
                  continue
              svc_blob = json.dumps(svc)
              for secret_name in ("JWT_SIGNING_KEY", "MCP_BROWSER_SESSION_KEY",
                                  "SESSION_TOKEN_PEPPER", "GOOGLE_CLIENT_SECRET",
                                  "GITHUB_CLIENT_SECRET", "POSTGRES_PASSWORD"):
                  value = env_file.get(secret_name, "")
                  if value:
                      assert value not in svc_blob, f"{name} leaked {secret_name}"
          print("  [10] no secret value leaked into any other service")
          print("ALL COMPOSE ASSERTIONS PASSED")
          PYEOF

      # ── 4. 镜像构建（走 compose，与手册第 ③ 步一致） ──────────────────
      - name: Docker build (same command as the runbook)
        run: |
          unset POSTGRES_PASSWORD 2>/dev/null || true
          docker compose --env-file .env.production build cloud

      # 运行镜像只带生产依赖：devDependencies 不该出现在生产层。
      - name: Verify runtime image has no devDependencies
        run: |
          for p in typescript eslint vitest drizzle-kit tsx; do
            if docker run --rm brewphase-cloud:latest sh -c "test -d node_modules/$p"; then
              echo "::error::devDependency $p leaked into the runtime image"
              exit 1
            fi
            echo "ok: $p absent"
          done
          for p in hono jose postgres ws zod; do
            docker run --rm brewphase-cloud:latest sh -c "test -d node_modules/$p" \
              || { echo "::error::runtime dependency $p missing"; exit 1; }
            echo "ok: $p present"
          done

      # ── 5. 预检：手册第 ④ 步的原样命令，必须通过 ──────────────────────
      # 用 compose run（而不是 docker run --env-file）是为了拿到**最终注入
      # 容器的** DATABASE_URL——它由 POSTGRES_* 拼成，手工 export 无法证明
      # 部署配置正确。
      - name: Run production preflight with the exact runbook command
        run: |
          set -o pipefail
          unset POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB \
                JWT_SIGNING_KEY SESSION_TOKEN_PEPPER \
                GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
                MCP_BROWSER_SESSION_KEY ACME_EMAIL BREWPHASE_DOMAIN \
                BASE_URL DATABASE_URL 2>/dev/null || true
          docker compose --env-file .env.production run --rm --no-deps cloud \
            node dist/scripts/preflight-remote-mcp.js | tee /tmp/preflight-ok.log
          # 预检必须真的看到 Compose 注入的 DATABASE_URL（不是空、不是宿主值），
          # 并且域名与 BASE_URL 指向同一个名字。
          grep -q "BREWPHASE_DOMAIN .*identical to the hostname of BASE_URL" /tmp/preflight-ok.log
          grep -q "DATABASE_URL .*host=db, port=5432" /tmp/preflight-ok.log
          grep -q "POSTGRES_PASSWORD .*URL-safe, not a placeholder" /tmp/preflight-ok.log
          echo "preflight OK with the composed DATABASE_URL + matching BREWPHASE_DOMAIN"

      # ── 5b. 断言库自检：证明「该失败时会失败」 ───────────────────────
      # 负向测试最容易的退化是「永远通过」。这一段用**隔离的假命令**验证
      # 断言库的判别力（不碰 Docker / PostgreSQL，也不冒充集成测试）。
      - name: Assertion helpers must be able to fail
        run: |
          set -o pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/ci-assertions.sh"

          fail() { echo "::error::$1"; exit 1; }

          # (1) 预期错误码写错 → helper 必须失败
          if expect_preflight_failure /tmp/self-code.log database_url_TYPO \
              bash -c 'echo "[preflight:remote-mcp] FAILED"; echo "  - [database_url_missing] x"; exit 1'; then
            fail "helper accepted a wrong expected error code"
          fi
          echo "ok: wrong expected code -> helper fails"

          # (2) 命令意外成功 → helper 必须失败
          if expect_preflight_failure /tmp/self-ok.log database_url_missing \
              bash -c 'echo "all checks passed"; exit 0'; then
            fail "helper accepted a successful preflight"
          fi
          echo "ok: unexpected success -> helper fails"

          # (3) docker 基础设施错误（125）→ 不能被当成「预检正确拒绝」
          #     注意日志里**含**预期错误码：仍必须因退出码不符而失败。
          if expect_preflight_failure /tmp/self-infra.log database_url_missing \
              bash -c 'echo "[preflight:remote-mcp] FAILED"; echo "  - [database_url_missing] x"; exit 125'; then
            fail "helper accepted a docker infrastructure failure"
          fi
          echo "ok: infra failure (exit 125) -> helper fails"

          # (4) 日志含 Secret → 必须失败，且 helper 自己不得把 Secret 回显出来
          if expect_preflight_failure /tmp/self-leak.log database_url_missing \
              bash -c 'echo "[preflight:remote-mcp] FAILED"; echo "  - [database_url_missing] x"; echo "value=ci_r5r3_pepper_0123456789"; exit 1' \
              > /tmp/self-leak.out 2>&1; then
            fail "helper accepted a leaking log"
          fi
          if grep -Fq "ci_r5r3_pepper_0123456789" /tmp/self-leak.out; then
            fail "helper echoed the leaked secret to its own output"
          fi
          echo "ok: secret in log -> helper fails without echoing it"

          # (5) 迁移日志泄漏 → assert_no_secret_in_log 必须失败
          printf 'pw=7c1f0b9d4e2a6835fa91c0d7e5b32468\n' > /tmp/self-migrate.log
          if assert_no_secret_in_log /tmp/self-migrate.log "self-test migration #2"; then
            fail "assert_no_secret_in_log accepted a leaking log"
          fi
          echo "ok: leaking second-migration log -> assertion fails"

          # 正向对照：干净日志必须通过（否则说明断言过激，会把正常构建判死）
          printf 'pw=***\n' > /tmp/self-clean.log
          assert_no_secret_in_log /tmp/self-clean.log "self-test clean log" \
            || fail "assert_no_secret_in_log rejected a clean log"
          echo "ok: clean log passes"

      # ── 6. 预检负例：缺项 / 弱口令 / 域名 / 数据库连接串 ────────────────
      # 这一段的教训（R5-R3.2）：原来是 `set +e` 包住整个步骤，中间十几个
      # `grep -q` 即便没匹配到也不会中断，最后一句 `exit 0` 把整步判成通过——
      # 也就是说「错误码根本没出现」这种情况会被静默吃掉。
      #
      # 现在改成一个断言函数，每次调用做三件事，缺一条都算失败：
      #   1. 命令必须**非零退出**（`if cmd; then 失败`，不用 `$?`）；
      #   2. 输出必须含**完整错误码**（`grep -Fq "[code]"`，不猜子串）；
      #   3. 输出不得含任何测试 Secret。
      # 命令若因 docker / 网络 / 镜像问题失败，输出里不会有错误码 → 同样判失败，
      # 不会被误认为「预检正确拒绝了配置」。
      - name: Preflight must fail on missing or unsafe configuration
        run: |
          set -o pipefail

          # 断言库与 Secret 名单的唯一维护点（含 SESSION_TOKEN_PEPPER）。
          source "$GITHUB_WORKSPACE/.github/scripts/ci-assertions.sh"

          run_pf() {
            docker compose --env-file .env.production run --rm --no-deps "$@" \
              cloud node dist/scripts/preflight-remote-mcp.js
          }

          # (a) 缺 MCP_BROWSER_SESSION_KEY → /mcp 会 404，必须拦下
          expect_preflight_failure /tmp/pf-neg.log mcp_browser_session_key_missing \
            run_pf -e MCP_BROWSER_SESSION_KEY=
          echo "ok: missing MCP_BROWSER_SESSION_KEY -> exit 1 + correct code"

          # (b) 缺 DATABASE_URL
          expect_preflight_failure /tmp/pf-neg.log database_url_missing \
            run_pf -e DATABASE_URL=
          echo "ok: missing DATABASE_URL -> exit 1 + correct code"

          # (c) 弱口令（8 位）
          expect_preflight_failure /tmp/pf-neg.log postgres_password_too_short \
            run_pf -e POSTGRES_PASSWORD=shortpw
          echo "ok: weak DB password -> exit 1 + correct code"

          # (d) 模板占位口令（照抄 .env.production.example 就上线）
          expect_preflight_failure /tmp/pf-neg.log postgres_password_placeholder \
            run_pf -e POSTGRES_PASSWORD=change-me-strong-password
          echo "ok: placeholder DB password -> exit 1 + correct code"

          # (e) 含 URL 保留字符的口令。
          # **必须同时覆盖 DATABASE_URL**：compose 在解析阶段就把 POSTGRES_PASSWORD
          # 插进 DATABASE_URL 了，只 `-e POSTGRES_PASSWORD` 不会重新插值，容器里的
          # DATABASE_URL 仍是那条正常的串——于是 database_url_invalid 永远不会出现。
          # 这里把两侧都换成含 `/` 的值，才真的能同时命中两个错误码。
          expect_preflight_failure /tmp/pf-neg.log postgres_password_unsafe_chars,database_url_invalid \
            run_pf \
              -e POSTGRES_PASSWORD="$CI_UNSAFE_TEST_PASSWORD" \
              -e DATABASE_URL="postgres://brewphase:${CI_UNSAFE_TEST_PASSWORD}@db:5432/brewphase_cloud"
          echo "ok: URL-unsafe DB password -> exit 1 (unsafe_chars + invalid URL)"

          # (f) 口令两侧不一致（DATABASE_URL 与 POSTGRES_PASSWORD 各改一边）
          expect_preflight_failure /tmp/pf-neg.log database_url_password_mismatch \
            run_pf -e POSTGRES_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaa
          echo "ok: DATABASE_URL/POSTGRES_PASSWORD mismatch -> exit 1 + correct code"

          # (g) BREWPHASE_DOMAIN 与 BASE_URL 不一致 → Caddy 会签另一个名字的证书
          expect_preflight_failure /tmp/pf-neg.log brewphase_domain_mismatch \
            run_pf -e BREWPHASE_DOMAIN=other.r5r3-deploy-check.example.org
          echo "ok: BREWPHASE_DOMAIN mismatch -> exit 1 + correct code"

          # (h) BREWPHASE_DOMAIN 不是裸主机名（带 scheme）→ 配置错误
          expect_preflight_failure /tmp/pf-neg.log brewphase_domain_invalid \
            run_pf -e BREWPHASE_DOMAIN=https://api.r5r3-deploy-check.example.org
          echo "ok: BREWPHASE_DOMAIN with scheme -> exit 1 + correct code"

          # (i) BASE_URL 带非默认端口 → compose 只发布 80/443
          expect_preflight_failure /tmp/pf-neg.log base_url_port_unsupported \
            run_pf -e BASE_URL=https://api.r5r3-deploy-check.example.org:8443
          echo "ok: BASE_URL :8443 -> exit 1 + correct code"

          # (j) DATABASE_URL 没有密码 → 必须失败（不能因为 undefined 跳过比较）
          expect_preflight_failure /tmp/pf-neg.log database_url_password_missing \
            run_pf -e DATABASE_URL=postgres://brewphase@db:5432/brewphase_cloud
          echo "ok: DATABASE_URL without password -> exit 1 + correct code"

          # (k) host / 库名 / 用户名 / 端口 各自不符
          expect_preflight_failure /tmp/pf-neg.log database_url_host_mismatch \
            run_pf -e DATABASE_URL='postgres://brewphase:7c1f0b9d4e2a6835fa91c0d7e5b32468@localhost:5432/brewphase_cloud'
          expect_preflight_failure /tmp/pf-neg.log database_url_name_mismatch \
            run_pf -e DATABASE_URL='postgres://brewphase:7c1f0b9d4e2a6835fa91c0d7e5b32468@db:5432/other_db'
          expect_preflight_failure /tmp/pf-neg.log database_url_user_mismatch \
            run_pf -e DATABASE_URL='postgres://someone_else:7c1f0b9d4e2a6835fa91c0d7e5b32468@db:5432/brewphase_cloud'
          expect_preflight_failure /tmp/pf-neg.log database_url_port_unsupported \
            run_pf -e DATABASE_URL='postgres://brewphase:7c1f0b9d4e2a6835fa91c0d7e5b32468@db:5433/brewphase_cloud'
          echo "ok: DATABASE_URL host/db/user/port mismatches -> exit 1 + correct codes"

          echo "all preflight negative cases failed for the RIGHT reason"

      # ── 7. 真实 PostgreSQL：起 compose 的 db，跑手册第 ⑤ 步的迁移 ──────
      # 这一步同时证明「DATABASE_URL 指向的 host/port/口令确实可用」——
      # 前面的断言只证明字符串解析正确，这里证明它能真的连上。
      - name: Start the compose database
        run: |
          unset POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB \
                JWT_SIGNING_KEY SESSION_TOKEN_PEPPER \
                GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
                MCP_BROWSER_SESSION_KEY ACME_EMAIL BREWPHASE_DOMAIN \
                BASE_URL DATABASE_URL 2>/dev/null || true
          docker compose --env-file .env.production up -d --wait db
          docker compose --env-file .env.production ps

      - name: Run migrations twice (idempotent, runbook command)
        run: |
          set -o pipefail
          unset POSTGRES_PASSWORD DATABASE_URL 2>/dev/null || true
          docker compose --env-file .env.production run --rm cloud \
            node dist/scripts/migrate.js | tee /tmp/migrate-1.log
          docker compose --env-file .env.production run --rm cloud \
            node dist/scripts/migrate.js | tee /tmp/migrate-2.log
          source "$GITHUB_WORKSPACE/.github/scripts/ci-assertions.sh"

          # 先扫 Secret，再判成功——顺序与负向断言一致：
          # 万一日志里真的出现口令，什么都不输出也比先打印再报错好。
          #
          # 两份日志都要扫：第二次迁移同样会打印连接信息（至少回显
          # DATABASE_URL 的解析结果），只查第一份等于默许第二份成为泄漏通道。
          # 注意不能写成 `! grep -q`：bash 的 `-e` 对 `!` 取反的命令不生效，
          # 那等于「找到口令也不失败」——正是要清掉的一类假通过。
          assert_no_secret_in_log /tmp/migrate-1.log "first migration"
          assert_no_secret_in_log /tmp/migrate-2.log "second migration"

          grep -Fq "[migrate] database migrations applied" /tmp/migrate-1.log
          grep -Fq "[migrate] database migrations applied" /tmp/migrate-2.log

          echo "migrations applied twice (idempotent), no secret in either log"

      # ── 8. Caddyfile：有变量必须通过，缺变量必须失败 ───────────────────
      # 走 compose run（而不是 docker run -e）：这样注入的正是 .env.production
      # 经 compose 解析后的那两个值，与生产启动路径完全一致。
      - name: Caddyfile validates with the values from .env.production
        run: |
          set -o pipefail
          docker compose --env-file .env.production run --rm --no-deps \
            caddy caddy validate --config /etc/caddy/Caddyfile | tee /tmp/caddy-ok.log
          grep -q "Valid configuration" /tmp/caddy-ok.log
          echo "caddy validate OK for $(grep -E '^BREWPHASE_DOMAIN=' .env.production | cut -d= -f2-)"

      - name: Caddyfile must fail when the domain or email is missing
        run: |
          set -o pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/ci-assertions.sh"

          run_caddy() {
            docker compose --env-file .env.production run --rm --no-deps "$@" \
              caddy caddy validate --config /etc/caddy/Caddyfile
          }

          # (a) 两个都缺 → `email ` 指令没有参数
          expect_failure_with_reason /tmp/caddy-both.log "wrong argument count" \
            run_caddy -e ACME_EMAIL= -e BREWPHASE_DOMAIN=
          echo "ok: missing ACME_EMAIL -> validate fails (wrong argument count)"

          # (b) 只缺域名（邮箱正常）→ 站点键为空，而不是启动到错误域名
          expect_failure_with_reason /tmp/caddy-domain.log "server block without any key" \
            run_caddy -e BREWPHASE_DOMAIN=
          echo "ok: missing BREWPHASE_DOMAIN -> validate fails (empty site key)"

          # Caddyfile 不得保留任何 env 变量兜底默认值（否则漏配会静默用错域名）。
          if grep -qE '\{\$[A-Z_]+:' Caddyfile; then
            echo "::error::Caddyfile still has a fallback default for an env var"
            exit 1
          fi
          echo "ok: no env-var fallback defaults in Caddyfile"

      # ── 9. 清理 ────────────────────────────────────────────────────────
      - name: Tear down the temporary stack
        if: always()
        run: |
          docker compose --env-file .env.production down -v --remove-orphans || true
          rm -f .env.production
          echo "temporary stack removed"

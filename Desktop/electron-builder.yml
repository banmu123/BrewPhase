appId: com.brewphase.desktop
productName: BrewPhase
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# better-sqlite3 13 自带各平台 N-API 预编译二进制（gypfile: false），
# 不需要在打包时重建原生模块；显式解包避免 asar 内的 .node 无法加载。
npmRebuild: false
asarUnpack:
  - "**/better-sqlite3/prebuilds/**/*.node"
artifactName: "BrewPhase-${version}-${os}-${arch}.${ext}"

mac:
  category: public.app-category.food-and-drink
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 由 iOS 的 AppIcon 母版生成：squircle 底板 + 1024/512/256/128/64/32/16 十档
  icon: build/icon.icns
  # 签名身份不写死，由 CI 的 CSC_LINK / CSC_KEY_PASSWORD（或 CSC_NAME）注入；
  # 没有证书时产出 ad-hoc/未签名包，只能内测，不能对外发布。
  # identity: "Developer ID Application: Your Name (TEAMID)"
  # 公证凭据（APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER 或
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID）齐备时，
  # 发布工作流会显式传 -c.mac.notarize=true；未配置时传 false。
win:
  target: [nsis]
  icon: build/icon.ico
  # Windows 代码签名同样由 CI 的 CSC_LINK / CSC_KEY_PASSWORD 提供，
  # 未配置则产出未签名 exe（会被 SmartScreen 拦截，仅供内测）。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: BrewPhase
  # 本地优先：卸载不删 SQLite / media 里的用户数据
  deleteAppDataOnUninstall: false
linux:
  target: [AppImage]
  category: Office
  icon: build/icon.png

appId: com.brewphase.desktop
productName: BrewPhase
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # MCP runtime 由 extraResources 放到 asar 之外，asar 里不再保留一份副本。
  - "!out/mcp/**"
asar: true
# better-sqlite3 13 自带各平台 N-API 预编译二进制（gypfile: false），
# 不需要在打包时重建原生模块；显式解包避免 asar 内的 .node 无法加载。
npmRebuild: false
asarUnpack:
  - "**/better-sqlite3/prebuilds/**/*.node"
# MCP STDIO runtime —— 必须落在 asar 之外。
# 入口由 Codex / WorkBuddy 等外部客户端用普通 Node spawn，而 Node 不认识 asar
# 的虚拟文件系统，所以把它复制到 <resources>/mcp。
# 构建产物是**单文件**（vite.mcp.config.ts 把 SDK 与 zod 全部内联），因此这里
# 不需要再带 node_modules —— 也就绕开了 pnpm 符号链接导致依赖复制不全的问题。
extraResources:
  - from: out/mcp
    to: mcp
    filter:
      - "**/*"
      - "!**/*.map"
artifactName: "BrewPhase-${version}-${os}-${arch}.${ext}"

mac:
  # Native Messaging Host（Chrome Companion）：只带当前平台的二进制。
  extraResources:
    - from: resources/native-host/darwin
      to: native-host
  category: public.app-category.food-and-drink
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 由 iOS 的 AppIcon 母版生成：squircle 底板 + 1024/512/256/128/64/32/16 十档
  icon: build/icon.icns
  # 签名身份不写死，由 CI 的 CSC_LINK / CSC_KEY_PASSWORD（或 CSC_NAME）注入；
  # 没有证书时产出 ad-hoc/未签名包，只能内测，不能对外发布。
  # identity: "Developer ID Application: Your Name (TEAMID)"
  # 公证凭据（APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER 或
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID）齐备时，
  # 发布工作流会显式传 -c.mac.notarize=true；未配置时传 false。
win:
  extraResources:
    - from: resources/native-host/win32
      to: native-host
  target: [nsis]
  icon: build/icon.ico
  # Windows 代码签名同样由 CI 的 CSC_LINK / CSC_KEY_PASSWORD 提供，
  # 未配置则产出未签名 exe（会被 SmartScreen 拦截，仅供内测）。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: BrewPhase
  # 本地优先：卸载不删 SQLite / media 里的用户数据
  deleteAppDataOnUninstall: false
linux:
  extraResources:
    - from: resources/native-host/linux
      to: native-host
  target: [AppImage]
  category: Office
  icon: build/icon.png
